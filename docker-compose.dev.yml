services:
  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=nodequeue
      - POSTGRES_USER=nodequeue
      - POSTGRES_PASSWORD=nodequeue
    ports:
      - "5432:5432"
    volumes:
      - nodequeue_db_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  queue-service:
    image: golang:1.24-alpine
    working_dir: /app/queue-service
    environment:
      - PORT=8080
      - CGO_ENABLED=0
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=nodequeue
      - DB_USER=nodequeue
      - DB_PASSWORD=nodequeue
      - MASTER_SERVICE_URL=http://queue-admin:8081
    volumes:
      - ./queue-service:/app/queue-service
      - ./queue-common:/app/queue-common
      - go_mod_cache:/go/pkg/mod
    ports:
      - "8080:8080"
    depends_on:
      - db
      - queue-admin
    command: sh -c "go mod download && go run ."

  queue-admin:
    image: golang:1.24-alpine
    working_dir: /app/queue-admin
    environment:
      - PORT=8081
      - CGO_ENABLED=0
      - MASTER_DB_HOST=db
      - MASTER_DB_PORT=5432
      - MASTER_DB_NAME=master_db
      - MASTER_DB_USER=nodequeue
      - MASTER_DB_PASSWORD=nodequeue
      - MASTER_DB_SSLMODE=disable
      - NODEQUEUE_DB_HOST=db
      - NODEQUEUE_DB_PORT=5432
      - NODEQUEUE_DB_NAME=nodequeue
      - NODEQUEUE_DB_USER=nodequeue
      - NODEQUEUE_DB_PASSWORD=nodequeue
      - NODEQUEUE_DB_SSLMODE=disable
    volumes:
      - ./queue-admin:/app/queue-admin
      - ./queue-common:/app/queue-common
      - go_mod_cache:/go/pkg/mod
    ports:
      - "8081:8081"
    depends_on:
      - db
    command: sh -c "go mod download && go run ."

  queue-ui:
    image: node:20-alpine
    working_dir: /app
    environment:
      - NEXT_PUBLIC_API_BASE_URL=/api
      - API_PROXY_TARGET=http://queue-service:8080
      - MASTER_API_PROXY_TARGET=http://queue-admin:8081
      - HOSTNAME=0.0.0.0
      - PORT=3000
    volumes:
      - ./queue-ui:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - queue-service
      - queue-admin
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"

volumes:
  go_mod_cache:
  web_node_modules:
  nodequeue_db_data:
    name: nodequeue_db_data_dev

