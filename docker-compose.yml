services:
  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=nodequeue
      - POSTGRES_USER=nodequeue
      - POSTGRES_PASSWORD=nodequeue
    ports:
      - "5432:5432"
    volumes:
      - nodequeue_db_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodequeue -d nodequeue"]
      interval: 5s
      timeout: 3s
      retries: 20

  queue-service:
    build:
      context: .
      dockerfile: queue-service/Dockerfile
    environment:
      - PORT=8080
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=nodequeue
      - DB_USER=nodequeue
      - DB_PASSWORD=nodequeue
      - MASTER_SERVICE_URL=http://queue-admin:8081
    ports:
      - "8080:8080"
    depends_on:
      - db
      - queue-admin

  queue-admin:
    build:
      context: .
      dockerfile: queue-admin/Dockerfile
    environment:
      - PORT=8081
      - MASTER_DB_HOST=db
      - MASTER_DB_PORT=5432
      - MASTER_DB_NAME=master_db
      - MASTER_DB_USER=nodequeue
      - MASTER_DB_PASSWORD=nodequeue
      - MASTER_DB_SSLMODE=disable
      - NODEQUEUE_DB_HOST=db
      - NODEQUEUE_DB_PORT=5432
      - NODEQUEUE_DB_NAME=nodequeue
      - NODEQUEUE_DB_USER=nodequeue
      - NODEQUEUE_DB_PASSWORD=nodequeue
      - NODEQUEUE_DB_SSLMODE=disable
    ports:
      - "8081:8081"
    depends_on:
      - db

  queue-ui:
    build:
      context: ./queue-ui
      dockerfile: Dockerfile
      args:
        # This must be the browser-reachable API URL.
        - NEXT_PUBLIC_API_BASE_URL=/api
        # Used at build-time by next.config.ts to proxy `/api/*` to the backend service.
        - API_PROXY_TARGET=http://queue-service:8080
        - MASTER_API_PROXY_TARGET=http://queue-admin:8081
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Kept for clarity/override at runtime; build arg above ensures it is available during `next build`.
      - API_PROXY_TARGET=http://queue-service:8080
      - MASTER_API_PROXY_TARGET=http://queue-admin:8081
    ports:
      - "3000:3000"
    depends_on:
      - queue-service
      - queue-admin

volumes:
  nodequeue_db_data:
    name: nodequeue_db_data

